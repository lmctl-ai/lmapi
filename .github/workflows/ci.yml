name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  spec-test:
    name: Spec Unit Tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lmapi
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run spec unit tests
        run: npm test

  cross-sdk:
    name: Cross-SDK Conformance (lmts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lmts
    steps:
      - name: Checkout lmapi
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: lmapi

      - name: Checkout lmts reference SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: lmctl-ai/lmts
          path: lmts

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lmts test suite against lmapi
        run: bun test
